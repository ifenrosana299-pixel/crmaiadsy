<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Insights · Adsy CS</title>
<script></script>
<link rel="stylesheet" href="css/style.css">
<style>
body.light{--bg:#f1f5f9;--white:#ffffff;--border:rgba(0,0,0,.07);--text:#0f172a;--text-2:#475569;--text-3:#94a3b8}
.main-content{background:var(--bg);min-height:100vh;padding:0}
/* sidebar pakai #sidebar dari style.css (position:fixed) */
.sb-logo{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.sb-title{font-size:15px;font-weight:700;color:#f1f5f9;letter-spacing:-.3px}
.sb-subtitle{font-size:10px;color:#64748b;margin-top:1px}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.sb-section{font-size:10px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.5px;padding:10px 14px 4px;margin-top:4px}
.bot-online{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#22c55e;padding:6px 10px;background:rgba(34,197,94,.08);border-radius:6px;margin:8px 14px}
.bot-dot{width:6px;height:6px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 8px;border-radius:8px;font-size:13px;font-weight:500;color:#cbd5e1;text-decoration:none;transition:all .12s}
.sb-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.sb-item.active{background:rgba(59,130,246,.12);color:#93c5fd}
.sb-item .si{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-item .si svg{width:16px;height:16px;display:block}
.sb-divider{height:1px;background:rgba(255,255,255,.05);margin:4px 8px}
.sb-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
body.light #sidebar{background:#f8fafc;border-right-color:rgba(0,0,0,.08)}
body.light .sb-title{color:#0f172a}
body.light .sb-item{color:#475569!important}
body.light .sb-item:hover{background:rgba(0,0,0,.04)!important;color:#0f172a!important}
body.light .sb-item.active{background:rgba(59,130,246,.1)!important;color:#2563eb!important}
body.light .sb-divider{background:rgba(0,0,0,.07)}
body.light .bot-online{background:rgba(34,197,94,.06)}

.btn-sop{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:all .15s}
.btn-sop:hover{border-color:#8b5cf6;color:#8b5cf6;background:rgba(139,92,246,.04)}
body.light .btn-sop{background:#f8fafc}
.hero-count{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);font-size:12px;font-weight:700;color:#a78bfa}
.hero-count .dot{width:6px;height:6px;border-radius:50%;background:#a78bfa}

/* ── INSIGHT TABLE ── */
.tc{background:var(--white);border:1px solid var(--border);border-radius:16px;margin:0 24px 24px;overflow:hidden}
.tc-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tc-hdr-left{display:flex;align-items:center;gap:10px}
.tc-hdr-icon{width:30px;height:30px;border-radius:8px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);display:flex;align-items:center;justify-content:center;font-size:13px}
.tc-title{font-size:14px;font-weight:700;color:var(--text)}
.tc-sub{font-size:11px;color:var(--text-2);margin-top:1px}
.badge-cnt{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.2)}

.tc-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--bg)}
th{padding:10px 18px;text-align:left;font-size:10px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:14px 18px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(139,92,246,.02)}

.cust-cell{display:flex;align-items:center;gap:10px}
.c-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.c-name{font-size:13px;font-weight:600;color:var(--text)}
.c-since{font-size:11px;color:var(--text-2);margin-top:1px}

.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.bdg-eskal{background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
.bdg-baru{background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.2)}

.btn-sop-sm{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:8px;background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.2);font-size:12px;font-weight:600;text-decoration:none;transition:opacity .15s;cursor:pointer;white-space:nowrap}
.btn-sop-sm:hover{opacity:.8;color:#a78bfa}

.empty-cell{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty-cell .e-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-cell h4{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-cell p{font-size:13px;line-height:1.6}
</style>
</head>
<body>
<script>if(localStorage.getItem('cs_theme')!=='dark')document.body.classList.add('light');</script>
<div class="app-layout">
  <div id="sidebar"></div>
  <div class="main-content">

    <!-- Page Header -->
    <div class="page-header">
      <div>
        <div class="page-title">✨ AI Insights</div>
        <div class="page-sub">Percakapan yang lolos dari bot — lengkapi di Katalog &amp; SOP agar bot makin akurat</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="hero-count" style="position:static"><span class="dot"></span><span id="hero-cnt">0</span> terbuka</span>
        <a class="btn-sop" href="products.html" style="padding:7px 14px;font-size:12px">📋 Buka Katalog &amp; SOP</a>
      </div>
    </div>

    <!-- Table -->
    <div class="tc" style="margin-top:20px">
      <div class="tc-hdr">
        <div class="tc-hdr-left">
          <div class="tc-hdr-icon">⚡</div>
          <div>
            <div class="tc-title">Percakapan yang perlu ditinjau</div>
            <div class="tc-sub">Eskalasi yang belum diselesaikan</div>
          </div>
        </div>
        <span class="badge-cnt" id="tbl-cnt">0 case</span>
      </div>
      <div class="tc-wrap">
        <table>
          <thead>
            <tr>
              <th>Pelanggan</th>
              <th>Aktivitas Terakhir</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="4" class="empty-cell"><div class="e-icon">⏳</div><p>Memuat data...</p></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
<script src="js/prod-switcher.js"></script>
<script src="js/theme.js"></script>
<script>
if (!getUser()) { window.location.href = 'login.html'; }

function sbFetch(table, query) {
  return fetch(`${window.__SB_URL}/rest/v1/${table}${query}`, {
    headers: { 'Content-Type':'application/json', apikey: window.__SB_KEY, Authorization: 'Bearer ' + window.__SB_KEY }
  }).then(r => r.ok ? r.json() : []).catch(() => []);
}

const AV_COLORS = ['#8b5cf6','#3b82f6','#ec4899','#f59e0b','#10b981','#06b6d4','#ef4444','#6366f1'];
function avColor(n) { let h=0; for(const c of(n||'?'))h=(h*31+c.charCodeAt(0))&0xffffffff; return AV_COLORS[Math.abs(h)%AV_COLORS.length]; }
function avInit(n) { return (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function relTime(iso) {
  if (!iso) return '—';
  const d = Date.now() - new Date(iso).getTime(), m = Math.floor(d/60000);
  if (m < 1) return 'Baru saja';
  if (m < 60) return m + ' menit lalu';
  const h = Math.floor(m/60);
  if (h < 24) return h + ' jam lalu';
  return Math.floor(h/24) + ' hari lalu';
}
function fmtDateTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
function cleanPhone(raw) {
  let n = String(raw||'').split('@')[0].replace(/\D/g,'');
  if (!n) return '—';
  if (n.startsWith('0')) n = '62' + n.slice(1);
  if (!n.startsWith('62')) n = '62' + n;
  const local = n.slice(2);
  if (local.length > 12) return '—';
  return '+62 ' + local.slice(0,3) + '-' + local.slice(3,7) + (local.length > 7 ? '-' + local.slice(7) : '');
}

const uid = getUser()?.id;

async function init() {
  await initConfig();
  renderSidebar('aiinsights');
  checkBotStatus();
  const prodFilter = window.__activeProductFilter || null;
  const prodQ = prodFilter ? `&product_id=eq.${prodFilter}` : '';
  const [convs, custs] = await Promise.all([
    sbFetch('conversations', `?user_id=eq.${uid}&status=eq.eskalasi${prodQ}&select=id,customer_id,status,updated_at&order=updated_at.desc`),
    sbFetch('customers', `?user_id=eq.${uid}&select=id,wa_number,nama`)
  ]);

  const custMap = {};
  custs.forEach(c => { custMap[c.id] = c; });

  document.getElementById('hero-cnt').textContent = convs.length;
  document.getElementById('tbl-cnt').textContent  = convs.length + ' case';

  const tbody = document.getElementById('tbody');
  if (!convs.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty-cell">
      <div class="e-icon">🎉</div>
      <h4>Bagus — belum ada yang lolos!</h4>
      <p>Jika bot menemukan pertanyaan di luar pengetahuannya,<br>pertanyaan itu akan muncul di sini agar kamu bisa melengkapinya<br>di Katalog &amp; SOP.</p>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = convs.map(c => {
    const cu   = custMap[c.customer_id] || {};
    const nama = cu.nama || cu.wa_number || 'Pelanggan';
    const color = avColor(nama);
    const ini   = avInit(nama);
    return `<tr>
      <td>
        <div class="cust-cell">
          <div class="c-av" style="background:${color}">${escH(ini)}</div>
          <div>
            <div class="c-name">${escH(nama)}</div>
            <div class="c-since">${escH(cleanPhone(cu.wa_number))}</div>
          </div>
        </div>
      </td>
      <td style="color:var(--text-2)">
        <div>${relTime(c.updated_at)}</div>
        <div style="font-size:11px;margin-top:2px">${fmtDateTime(c.updated_at)}</div>
      </td>
      <td><span class="bdg bdg-eskal">⬆ Eskalasi</span></td>
      <td>
        <div style="display:flex;gap:8px;align-items:center">
          <a class="btn-sop-sm" href="dashboard.html?conv=${c.id}">💬 Buka Console</a>
          <a class="btn-sop-sm" href="products.html" style="background:rgba(34,197,94,.1);color:#22c55e;border-color:rgba(34,197,94,.2)">📋 Tambah ke SOP</a>
        </div>
      </td>
    </tr>`;
  }).join('');
}

init();
window.addEventListener('productSwitch', () => init());
</script>
</body>
</html>

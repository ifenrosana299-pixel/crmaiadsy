<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — AI CRM Adsy</title>
<script>if(localStorage.getItem('cs_theme')!=='dark')document.body.classList.add('light');</script>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* alias variabel lama → baru */
:root {
  --bg2: #161b22;
  --bg3: #0d1117;
  --text2: #64748b;
  --text3: #475569;
}
body.light {
  --bg2: #ffffff;
  --bg3: #f1f5f9;
  --text2: #475569;
  --text3: #94a3b8;
}

body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }

.theme-toggle {
  position:fixed; top:16px; right:16px;
  width:36px; height:36px; border-radius:50%;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:#94a3b8; font-size:16px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .15s; z-index:10;
}
.theme-toggle:hover { background:rgba(255,255,255,.1); color:#e2e8f0; }
body.light .theme-toggle { border-color:rgba(0,0,0,.1); background:rgba(0,0,0,.04); color:#475569; }
body.light .theme-toggle:hover { background:rgba(0,0,0,.08); color:#0f172a; }

.login-wrap {
  width:100%; max-width:420px;
}

.login-card {
  background:#161b22;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:32px 28px;
  box-shadow:0 24px 64px rgba(0,0,0,.4);
}
body.light .login-card {
  background:#fff;
  border-color:rgba(0,0,0,.07);
  box-shadow:0 8px 32px rgba(0,0,0,.1);
}

.login-logo {
  display:flex; flex-direction:column; align-items:center;
  margin-bottom:28px; text-align:center;
}
.login-logo-icon {
  width:52px; height:52px;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; margin-bottom:12px;
}
.login-title {
  font-size:20px; font-weight:800; color:#f1f5f9; letter-spacing:-.4px;
}
body.light .login-title { color:#0f172a; }
.login-sub {
  font-size:12px; color:#64748b; margin-top:3px;
}

.login-err {
  background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.2);
  border-radius:8px;
  padding:10px 14px;
  color:#fca5a5;
  font-size:13px;
  margin-bottom:16px;
  display:none;
}

/* form-input & form-label sudah di style.css */
.form-input {
  width:100%; padding:9px 12px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;
  font-size:13px;
  background:#0d1117;
  color:#e2e8f0;
  outline:none;
  transition:border-color .15s;
}
.form-input:focus { border-color:rgba(59,130,246,.5); box-shadow:0 0 0 3px rgba(59,130,246,.08); }
.form-input::placeholder { color:#374151; }
body.light .form-input { background:#f8fafc; border-color:rgba(0,0,0,.1); color:#0f172a; }
body.light .form-input::placeholder { color:#94a3b8; }
.form-label {
  font-size:11px; font-weight:600; color:#64748b;
  text-transform:uppercase; letter-spacing:.4px;
  display:block; margin-bottom:6px;
}
body.light .form-label { color:#475569; }
.form-group { margin-bottom:16px; }
</style>
</head>
<body>
<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Ganti tema">🌙</button>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <img src="img/logo-adsy.png" style="width:32px;height:32px;object-fit:cover;border-radius:6px" onerror="this.parentElement.textContent='CRM'">
      </div>
      <div class="login-title">AI CRM Adsy</div>
      <div class="login-sub">Follow-up Engine</div>
    </div>

    <!-- TABS LOGIN / DAFTAR -->
    <div style="display:flex;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:24px;gap:4px">
      <button id="tab-login" onclick="switchTab('login')"
        style="flex:1;padding:8px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:var(--bg2);color:var(--text);transition:all .15s">
        Masuk
      </button>
      <button id="tab-daftar" onclick="switchTab('daftar')"
        style="flex:1;padding:8px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:var(--text2);transition:all .15s">
        Daftar
      </button>
    </div>

    <div class="login-err" id="form-err"></div>
    <div id="form-success" style="background:rgba(16,185,129,.1);border:1px solid var(--green);border-radius:8px;padding:10px 14px;color:#34d399;font-size:13px;margin-bottom:16px;display:none"></div>

    <!-- FORM LOGIN -->
    <div id="form-login">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-input" id="inp-user" placeholder="Masukkan username" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="inp-pass" placeholder="Masukkan password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="btn-login" onclick="doLogin()">
        Masuk
      </button>
    </div>

    <!-- FORM DAFTAR -->
    <div id="form-daftar" style="display:none">
      <div class="form-group">
        <label class="form-label">Nama Toko / Brand *</label>
        <input type="text" class="form-input" id="reg-nama" placeholder="Contoh: Toko Herbal Adsy">
      </div>
      <div class="form-group">
        <label class="form-label">Username *</label>
        <input type="text" class="form-input" id="reg-user" placeholder="Huruf kecil, tanpa spasi" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Password *</label>
        <input type="password" class="form-input" id="reg-pass" placeholder="Minimal 6 karakter" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Konfirmasi Password *</label>
        <input type="password" class="form-input" id="reg-pass2" placeholder="Ulangi password">
      </div>
      <button class="btn btn-success" style="width:100%;justify-content:center" id="btn-daftar" onclick="doDaftar()">
        Buat Akun
      </button>
    </div>

    <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--text3)">
      AI CRM Adsy v1.0 · Follow-up Engine
    </div>
  </div>
</div>

<script>
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  localStorage.setItem('cs_theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isLight ? '☀️' : '🌙';
}

// Set icon sesuai tema saat ini
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
});

async function initConfig() {
  try {
    const r = await fetch('/api/config');
    const c = await r.json();
    window.__SB_URL = c.supabase_url;
    window.__SB_KEY = c.supabase_anon_key;
  } catch {}
}

// ---- TAB SWITCH ----
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('form-login').style.display  = isLogin ? '' : 'none';
  document.getElementById('form-daftar').style.display = isLogin ? 'none' : '';
  document.getElementById('tab-login').style.background  = isLogin ? 'var(--bg2)' : 'transparent';
  document.getElementById('tab-login').style.color       = isLogin ? 'var(--text)' : 'var(--text2)';
  document.getElementById('tab-daftar').style.background = isLogin ? 'transparent' : 'var(--bg2)';
  document.getElementById('tab-daftar').style.color      = isLogin ? 'var(--text2)' : 'var(--text)';
  clearMsg();
}

function showErr(msg) {
  const el = document.getElementById('form-err');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('form-success').style.display = 'none';
}

function showSuccess(msg) {
  const el = document.getElementById('form-success');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('form-err').style.display = 'none';
}

function clearMsg() {
  document.getElementById('form-err').style.display = 'none';
  document.getElementById('form-success').style.display = 'none';
}

// ---- HELPERS ----
async function sbGet(table, params) {
  const r = await fetch(`${window.__SB_URL}/rest/v1/${table}?${params}`, {
    headers: { apikey: window.__SB_KEY, Authorization: `Bearer ${window.__SB_KEY}` }
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sbPost(table, body) {
  const r = await fetch(`${window.__SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      apikey: window.__SB_KEY,
      Authorization: `Bearer ${window.__SB_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'return=representation'
    },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ---- LOGIN ----
async function doLogin() {
  const username = document.getElementById('inp-user').value.trim();
  const password = document.getElementById('inp-pass').value;
  clearMsg();

  if (!username || !password) { showErr('Username dan password wajib diisi.'); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:6px"></span> Memuat...';

  try {
    await initConfig();
    const rows = await sbGet('users', `username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}&select=id,username,nama_toko`);
    if (!rows || rows.length === 0) throw new Error('Username atau password salah.');
    localStorage.setItem('crm_user', JSON.stringify(rows[0]));
    window.location.href = 'dashboard.html';
  } catch(e) {
    showErr(e.message || 'Login gagal.');
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
}

// ---- DAFTAR ----
async function doDaftar() {
  const nama  = document.getElementById('reg-nama').value.trim();
  const user  = document.getElementById('reg-user').value.trim().toLowerCase();
  const pass  = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  clearMsg();

  if (!nama || !user || !pass || !pass2) { showErr('Semua field wajib diisi.'); return; }
  if (!/^[a-z0-9_]+$/.test(user)) { showErr('Username hanya boleh huruf kecil, angka, dan underscore.'); return; }
  if (pass.length < 6) { showErr('Password minimal 6 karakter.'); return; }
  if (pass !== pass2) { showErr('Konfirmasi password tidak cocok.'); return; }

  const btn = document.getElementById('btn-daftar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:6px"></span> Mendaftar...';

  try {
    await initConfig();

    // Cek username sudah ada belum
    const existing = await sbGet('users', `username=eq.${encodeURIComponent(user)}&select=id`);
    if (existing && existing.length > 0) throw new Error('Username sudah dipakai, coba username lain.');

    // Insert user baru
    const created = await sbPost('users', {
      username: user,
      password: pass,
      nama_toko: nama,
    });

    if (!created || !created[0]) throw new Error('Gagal membuat akun.');

    showSuccess('Akun berhasil dibuat! Silakan login.');
    // Auto-fill username di form login
    document.getElementById('inp-user').value = user;
    document.getElementById('inp-pass').value = '';
    setTimeout(() => switchTab('login'), 1500);
  } catch(e) {
    showErr(e.message || 'Pendaftaran gagal.');
  }

  btn.disabled = false;
  btn.textContent = 'Buat Akun';
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const loginVisible = document.getElementById('form-login').style.display !== 'none';
  if (loginVisible) doLogin(); else doDaftar();
});

// Check already logged in
try {
  const u = JSON.parse(localStorage.getItem('crm_user') || 'null');
  if (u) window.location.href = 'dashboard.html';
} catch {}
</script>
</body>
</html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import TikTok Shop — AI CRM Adsy</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* ── Sidebar styles ── */
.sb-brand{display:flex;align-items:center;gap:10px;padding:16px 14px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.sb-title{font-size:15px;font-weight:700;color:#f1f5f9;letter-spacing:-.3px}
.sb-subtitle{font-size:10px;color:#64748b;margin-top:1px}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.sb-section{font-size:10px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.5px;padding:10px 14px 4px;margin-top:4px}
.bot-online{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#22c55e;padding:6px 10px;background:rgba(34,197,94,.08);border-radius:6px;margin:8px 14px}
.bot-dot{width:6px;height:6px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 8px;border-radius:8px;font-size:13px;font-weight:500;color:#cbd5e1;text-decoration:none;transition:all .12s}
.sb-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.sb-item.active{background:rgba(59,130,246,.12);color:#93c5fd}
.sb-item .si{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-item .si svg{width:16px;height:16px;display:block}
.sb-divider{height:1px;background:rgba(255,255,255,.05);margin:4px 8px}
.sb-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
body.light #sidebar{background:#f8fafc;border-right-color:rgba(0,0,0,.08)}
body.light .sb-title{color:#0f172a}
body.light .sb-item{color:#475569!important}
body.light .sb-item:hover{background:rgba(0,0,0,.04)!important;color:#0f172a!important}

/* ── Page-specific ── */
.import-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 20px;
}
@media(max-width:860px) { .import-grid { grid-template-columns: 1fr; } }

.paste-area {
  width: 100%;
  min-height: 110px;
  resize: vertical;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  font-family: inherit;
  transition: border-color .12s, box-shadow .12s;
}
.paste-area:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59,130,246,.12);
}
.paste-area::placeholder { color: var(--text-3); font-size: 12px; }
body.light .paste-area { background: #f8fafc; }

.preview-box {
  background: rgba(59,130,246,.05);
  border: 1px solid rgba(59,130,246,.15);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-top: 14px;
}
body.light .preview-box { background: rgba(59,130,246,.04); }

.prev-row { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; font-size: 13px; }
.prev-lbl { color: var(--text-2); font-size: 11px; min-width: 80px; padding-top: 1px; }
.prev-val { color: var(--text); font-weight: 500; flex: 1; word-break: break-word; }

.hist-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600;
}
.hist-pending { background: rgba(245,158,11,.1);  color: #fbbf24; border: 1px solid rgba(245,158,11,.2); }
.hist-done    { background: rgba(34,197,94,.1);   color: #4ade80; border: 1px solid rgba(34,197,94,.2);  }
body.light .hist-pending { color: #d97706; }
body.light .hist-done    { color: #16a34a; }

.act-btn {

  border: 1px solid var(--border); background: none;
  color: var(--text-2); cursor: pointer; transition: .12s;
}
.act-btn:hover { background: rgba(255,255,255,.06); color: var(--text); }
.act-btn.del   { color: var(--red); border-color: rgba(239,68,68,.2); }
.act-btn.del:hover { background: rgba(239,68,68,.08); }
body.light .act-btn:hover { background: rgba(0,0,0,.04); }

.section-divider { border-top: 1px solid var(--border); margin: 10px 0; }

.count-pill {

/* ── Detail modal ── */

.det-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.det-field { display:flex; flex-direction:column; gap:2px; }
.det-field.full { grid-column:1/-1; }
.det-lbl { font-size:10px; color:var(--text-2); }
.det-val { font-size:13px; font-weight:500; color:var(--text); word-break:break-word; }
.det-val.mono { font-family:monospace; }
.det-val.green { color:#10b981; font-weight:700; }
.det-divider { border-top:1px solid var(--border); margin:12px 0; }

<script>
/* ════════════════════════════════
   TikTok Shop Import
════════════════════════════════ */

let historyData = [];
let products    = [];
let parsed      = {};

/* ── Init ── */
(async function init() {
  window.__currentUser = requireAuth();
  if (!window.__currentUser) return;
  renderSidebar('tiktok-import');
  updateDatetime();
  setInterval(updateDatetime, 60000);

  // Default tanggal = hari ini
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('inp-tanggal').value = today;

  await initConfig();
  await loadHistory();
})();

/* ── Saat user ganti produk aktif via switcher → reload history ── */
window.addEventListener('productSwitch', () => loadHistory());

/* ════════════════════════════════
   Parser
════════════════════════════════ */

function isPhone(s) {
  return /^[\s(]*(\+?62|08)\d{7,}/.test(s.replace(/[\s\-().]/g, ''));
}

function normalizePhone(s) {
  let n = s.replace(/[^\d]/g, '');
  if (n.startsWith('62')) n = '0' + n.slice(2);
  return n;
}

function parseRp(s) {
  return parseInt((s || '').replace(/[^\d]/g, '')) || 0;
}

function parsePembeli(text) {
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return {};

  let i = 0, nama = '', hp = '', jalan = [];

  // Baris 1: nama (skip kalau phone)
  if (lines[i] && !isPhone(lines[i])) { nama = lines[i]; i++; }
  // Berikut: HP
  if (lines[i] && isPhone(lines[i]))  { hp   = normalizePhone(lines[i]); i++; }
  // Tengah: baris alamat jalan (semua kecuali baris terakhir)
  while (i < lines.length - 1)        { jalan.push(lines[i]); i++; }
  // Baris terakhir: wilayah "Kel,Kec,Kota,Prov,Negara"
  const wilayah = lines[lines.length - 1] || '';
  const parts   = wilayah.split(',').map(p => p.trim());

  return {
    nama,
    hp,
    alamat    : jalan.join(', '),
    kelurahan : parts[0] || '',
    kecamatan : parts[1] || '',
    kota      : parts[2] || '',
    provinsi  : parts[3] || '',
  };
}

function parseRincian(text) {
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  const map   = {};
  let metode  = '';

  for (let i = 0; i < lines.length; i++) {
    // Tangkap metode pembayaran
    if (lines[i] === 'Metode pembayaran' && lines[i + 1]) {
      metode = lines[i + 1]; i++; continue;
    }
    // Tangkap pasangan label → Rp
    if (i < lines.length - 1 && /^-?Rp/.test(lines[i + 1])) {
      map[lines[i]] = parseRp(lines[i + 1]); i++;
    }
  }

  return {
    subtotal        : map['Subtotal item setelah diskon']    || 0,
    ongkir          : map['Biaya pengiriman sebelum diskon'] || 0,
    potongan_ongkir : map['Diskon ongkir dari platform']     || 0,
    total           : map['Total']                           || 0,
    metode_raw      : metode,
  };
}

function mapMetode(raw) {
  if (!raw) return '';
  const r = raw.toLowerCase();
  if (r.includes('tempat') || r.includes('cod'))      return 'COD';
  if (r.includes('qris'))                              return 'QRIS';
  if (r.includes('transfer'))                          return 'Transfer';
  if (r.includes('kredit') || r.includes('debit'))     return 'Kredit';
  return 'Lainnya';
}

function fmtRp(n) {
  if (!n) return '—';
  return 'Rp' + Number(n).toLocaleString('id-ID');
}

function autoParse() {
  const t1 = document.getElementById('paste-pembeli').value;
  const t2 = document.getElementById('paste-biaya').value;
  const p1 = parsePembeli(t1);
  const p2 = parseRincian(t2);
  parsed   = { ...p1, ...p2 };

  const hasData = p1.nama || p1.hp;
  const box     = document.getElementById('preview-box');
  box.style.display = hasData ? 'block' : 'none';

  document.getElementById('prev-nama').textContent   = p1.nama      || '—';
  document.getElementById('prev-hp').textContent     = p1.hp        || '—';
  document.getElementById('prev-alamat').textContent = p1.alamat    || '—';
  document.getElementById('prev-kec').textContent    = p1.kecamatan || '—';
  document.getElementById('prev-kota').textContent   = p1.kota      || '—';
  document.getElementById('prev-prov').textContent   = p1.provinsi  || '—';
  document.getElementById('prev-sub').textContent        = fmtRp(p2.subtotal);
  document.getElementById('prev-ongkir').textContent     = fmtRp(p2.ongkir);
  document.getElementById('prev-potongkir').textContent  = p2.potongan_ongkir ? '-' + fmtRp(p2.potongan_ongkir) : '—';
  document.getElementById('prev-total').textContent      = fmtRp(p2.total);

  // Auto-set metode bayar kalau berhasil di-parse
  if (p2.metode_raw) {
    const mapped = mapMetode(p2.metode_raw);
    if (mapped) document.getElementById('sel-metode').value = mapped;
  }
}

/* ════════════════════════════════
   Save
════════════════════════════════ */

async function saveOrder() {
  if (!parsed.nama && !parsed.hp) {
    toast('Paste info pembeli dulu', 'error'); return;
  }

  // Ambil produk dari active product switcher
  const activeId   = window.__activeProductFilter;
  const activeProd = (window.__userProducts || []).find(p => p.id === activeId);
  // Fallback: ambil nama dari teks yang tampil di prod-switcher UI
  const namaProduk = activeProd?.nama_produk
    || document.querySelector('.prod-sw-name')?.textContent?.trim()
    || '';
  const productId  = activeId || null;

  const row = {
    nama_customer   : parsed.nama      || '',
    nomer_hp        : parsed.hp        || '',
    alamat          : parsed.alamat    || '',
    kelurahan       : parsed.kelurahan || '',
    kecamatan       : parsed.kecamatan || '',
    kota            : parsed.kota      || '',
    provinsi        : parsed.provinsi  || '',
    nama_produk     : namaProduk,
    product_id      : productId,
    qty             : parseInt(document.getElementById('inp-qty').value) || 1,
    metode_bayar    : document.getElementById('sel-metode').value,
    ekspedisi       : document.getElementById('inp-ekspedisi').value.trim(),
    nomer_resi      : document.getElementById('inp-resi').value.trim(),
    subtotal        : parsed.subtotal        || 0,
    ongkir          : parsed.ongkir          || 0,
    potongan_ongkir : parsed.potongan_ongkir || 0,
    total           : parsed.total           || 0,
    tanggal         : document.getElementById('inp-tanggal').value || new Date().toISOString().slice(0, 10),
    sudah_diimport  : false,
  };

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = '⏳ Menyimpan...';

  try {
    // Cek duplikat by nomer_resi sebelum insert
    if (row.nomer_resi) {
      const existing = await sbGet('orders', `nomer_resi=eq.${encodeURIComponent(row.nomer_resi)}&user_id=eq.${window.__currentUser?.id}&select=id,nama_customer&limit=1`);
      if (existing && existing.length > 0) {
        btn.disabled = false; btn.textContent = 'Simpan Order';
        toast(`Duplikat! Resi ${row.nomer_resi} sudah ada (${existing[0].nama_customer})`, 'error');
        return;
      }
    }

    await sbPost('tiktok_orders', row);

    // Juga simpan ke orders supaya FU H+0 auto-terbuat
    const nomerResi = row.nomer_resi || '';
    await sbPost('orders', {
      user_id:        window.__currentUser?.id,
      product_id:     row.product_id,
      produk:         row.nama_produk,
      nama_customer:  row.nama_customer,
      nomer_hp:       row.nomer_hp,
      nomer_resi:     nomerResi,
      ekspedisi:      row.ekspedisi,
      alamat:         row.alamat,
      kelurahan:      row.kelurahan,
      kecamatan:      row.kecamatan,
      kabupaten:      row.kota,
      provinsi:       row.provinsi,
      jumlah_produk:  row.qty,
      payment:        row.metode_bayar,
      ongkir:         row.ongkir,
      potongan_ongkir:row.potongan_ongkir,
      jumlah_cod:     row.total,
      harga_produk:   row.subtotal,
      tanggal:        row.tanggal,
      status_resi:    nomerResi ? 'DIKIRIM' : 'MENUNGGU_RESI',
    });

    // Auto-generate jadwal FU (H+0 dst) — sama seperti customers.html
    fetch('/api/generate-schedules', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: window.__currentUser?.id, product_id: row.product_id || null })
    }).catch(() => {});

    toast('Order tersimpan + FU dijadwalkan!', 'ok');
    document.getElementById('paste-pembeli').value = '';
    document.getElementById('paste-biaya').value   = '';
    document.getElementById('preview-box').style.display = 'none';
    document.getElementById('inp-qty').value        = 1;
    document.getElementById('inp-resi').value       = '';
    document.getElementById('inp-ekspedisi').value  = '';
    parsed = {};
    await loadHistory();
  } catch(e) {
    toast('Gagal simpan: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Simpan ke CRM';
  }
}

/* ════════════════════════════════
   History
════════════════════════════════ */

async function loadHistory() {
  try {
    const activeId = window.__activeProductFilter;
    const filter   = activeId ? `&product_id=eq.${activeId}` : '';
    const data = await sbGet('tiktok_orders', `select=*&order=created_at.desc&limit=300${filter}`);
    historyData = data || [];
    renderHistory();
  } catch(e) {
    document.getElementById('hist-body').innerHTML =
      `<tr><td colspan="10" style="text-align:center;color:var(--red);padding:28px">Gagal load: ${e.message}</td></tr>`;
  }
}

function renderHistory() {
  document.getElementById('hist-count').textContent = historyData.length;
  const tbody = document.getElementById('hist-body');

  if (!historyData.length) {
    tbody.innerHTML =
      `<tr><td colspan="11" style="text-align:center;color:var(--text-2);padding:40px">
        <div style="font-size:28px;margin-bottom:8px">📦</div>
        Belum ada data
      </td></tr>`;
    return;
  }

  tbody.innerHTML = historyData.map(r => {
    const tgl    = r.tanggal || (r.created_at ? r.created_at.slice(0, 10) : '—');
    const badge  = r.sudah_diimport
      ? `<span class="hist-badge hist-done">✓ Diimport</span>`
      : `<span class="hist-badge hist-pending">Pending</span>`;
    const markBtn = !r.sudah_diimport
      ? `<button class="act-btn" onclick="markImported('${r.id}')">✓ Mark</button> `
      : '';
    return `<tr style="cursor:pointer" onclick="openDetail('${r.id}')" title="Klik untuk lihat detail">
      <td style="padding-left:16px" onclick="event.stopPropagation()">
        <input type="checkbox" class="row-chk" data-id="${r.id}">
      </td>
      <td class="text-sm text-dim">${esc(tgl)}</td>
      <td>
        <div class="fw-600" style="font-size:13px">${esc(r.nama_customer || '—')}</div>
        <div class="text-sm text-dim">${esc(r.kelurahan ? r.kecamatan + ', ' + r.kota : r.kota || '')}</div>
      </td>
      <td class="text-sm">${esc(r.nomer_hp || '—')}</td>
      <td class="text-sm" style="text-align:center">${r.qty || 1}</td>
      <td class="text-sm" style="font-family:monospace">${esc(r.nomer_resi || '—')}</td>
      <td class="text-sm">${esc(r.ekspedisi || '—')}</td>
      <td class="text-sm">${r.ongkir ? fmtRp(r.ongkir) : '—'}</td>
      <td class="text-sm fw-600">${fmtRp(r.total)}</td>
      <td class="text-sm">${esc(r.metode_bayar || '—')}</td>
      <td>${badge}</td>
      <td style="white-space:nowrap" onclick="event.stopPropagation()">
        ${markBtn}<button class="act-btn del" onclick="deleteRow('${r.id}')">Hapus</button>
      </td>
    </tr>`;
  }).join('');
}

/* ── Mark as imported ── */
async function markImported(id) {
  try {
    await sbPatch('tiktok_orders', `id=eq.${id}`, { sudah_diimport: true });
    toast('Ditandai sudah diimport', 'ok');
    await loadHistory();
  } catch(e) { toast('Gagal: ' + e.message, 'error'); }
}

/* ── Delete ── */
async function deleteRow(id) {
  if (!confirm('Hapus data ini?')) return;
  try {
    await sbDelete('tiktok_orders', `id=eq.${id}`);
    toast('Data dihapus', 'ok');
    await loadHistory();
  } catch(e) { toast('Gagal hapus: ' + e.message, 'error'); }
}

/* ── Select all ── */
function toggleAllCheck(v) {
  document.querySelectorAll('.row-chk:not(:disabled)').forEach(c => c.checked = v);
}

/* ════════════════════════════════
   Download Excel
   — format cocok dengan Import Excel di customers.html
════════════════════════════════ */

function downloadExcel(semua) {
  if (!window.XLSX) {
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    s.onload = () => doDownload(semua);
    document.head.appendChild(s);
    return;
  }
  doDownload(semua);
}

/* ════════════════════════════════
   Detail Modal
════════════════════════════════ */

  if (!r) return;

  document.getElementById('det-nama').textContent = r.nama_customer || 'Detail Order';

  const badge = r.sudah_diimport
    ? `<span class="hist-badge hist-done" style="font-size:11px">✓ Sudah Diimport</span>`
    : `<span class="hist-badge hist-pending" style="font-size:11px">Pending</span>`;

  document.getElementById('det-body').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      ${badge}
      <span class="text-sm text-dim">${r.tanggal || r.created_at?.slice(0,10) || ''}</span>
    </div>

    <div class="det-section">Info Pembeli</div>
    <div class="det-grid">
      <div class="det-field">
        <span class="det-lbl">Nama</span>
        <span class="det-val">${esc(r.nama_customer || '—')}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Nomer HP</span>
        <span class="det-val mono">${esc(r.nomer_hp || '—')}</span>
      </div>
      <div class="det-field full">
        <span class="det-lbl">Alamat</span>
        <span class="det-val">${esc(r.alamat || '—')}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Kecamatan</span>
        <span class="det-val">${esc(r.kecamatan || '—')}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Kota</span>
        <span class="det-val">${esc(r.kota || '—')}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Kelurahan</span>
        <span class="det-val">${esc(r.kelurahan || '—')}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Provinsi</span>
        <span class="det-val">${esc(r.provinsi || '—')}</span>
      </div>
    </div>

    <div class="det-divider"></div>
    <div class="det-section">Info Order</div>
    <div class="det-grid">
      <div class="det-field">
        <span class="det-lbl">Produk</span>
        <span class="det-val">${esc(
          r.nama_produk ||
          (window.__userProducts||[]).find(p=>p.id===r.product_id)?.nama_produk ||
          '—'
        )}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Qty</span>
        <span class="det-val">${r.qty || 1}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Ekspedisi</span>
        <span class="det-val">${esc(r.ekspedisi || '—')}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Nomer Resi</span>
        <span class="det-val mono">${esc(r.nomer_resi || '—')}</span>
      </div>
    </div>

    <div class="det-divider"></div>
    <div class="det-section">Rincian Biaya</div>
    <div class="det-grid">
      <div class="det-field">
        <span class="det-lbl">Metode Bayar</span>
        <span class="det-val">${esc(r.metode_bayar || '—')}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Subtotal</span>
        <span class="det-val">${fmtRp(r.subtotal)}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Ongkir</span>
        <span class="det-val">${fmtRp(r.ongkir)}</span>
      </div>
      <div class="det-field">
        <span class="det-lbl">Potongan Ongkir</span>
        <span class="det-val">${r.potongan_ongkir ? '-' + fmtRp(r.potongan_ongkir) : '—'}</span>
      </div>
      <div class="det-field full">

    </div>
  `;

  document.getElementById('det-modal').classList.add('open');
}

function closeDetail(e) {
  if (e.target === document.getElementById('det-modal')) {
    document.getElementById('det-modal').classList.remove('open');
  }
}

function doDownload(semua) {
  let rows;
  if (semua) {
    rows = historyData;
  } else {
    const ids = new Set(
      [...document.querySelectorAll('.row-chk:checked')].map(c => c.dataset.id)
    );
    rows = historyData.filter(r => ids.has(r.id));
  }

  if (!rows.length) {
    toast(semua ? 'Tidak ada data' : 'Pilih data dulu', 'error'); return;
  }

  // Header sesuai customers.html Import Excel
  const headers = [
    'tanggal', 'nama_customer', 'nomer_hp',
    'produk_1', 'jumlah_1', 'produk_2', 'jumlah_2',
    'cs', 'nomer_resi', 'jumlah_cod', 'ekspedisi',
    'alamat', 'kelurahan', 'kecamatan', 'kabupaten', 'provinsi',
    'adv', 'promo', 'keluhan', 'payment',
    'ongkir', 'potongan_ongkir', 'admin', 'potongan_admin', 'harga_produk'
  ];

  const wsData = [
    headers,
    ...rows.map(r => [
      r.tanggal       || '',
      r.nama_customer || '',
      r.nomer_hp      || '',
      r.nama_produk   || '',      // produk_1
      r.qty           || 1,       // jumlah_1
      '',                         // produk_2
      '',                         // jumlah_2
      '',                         // cs
      r.nomer_resi    || '',      // nomer_resi
      r.metode_bayar === 'COD' ? (r.total || 0) : 0,  // jumlah_cod
      r.ekspedisi     || '',      // ekspedisi
      r.alamat        || '',
      r.kelurahan     || '',
      r.kecamatan     || '',
      r.kota          || '',      // kabupaten = kota
      r.provinsi      || '',
      '',                         // adv
      '',                         // promo
      '',                         // keluhan
      r.metode_bayar  || '',      // payment
      r.ongkir        || '',      // ongkir
      r.potongan_ongkir || '',    // potongan_ongkir
      '',                         // admin
      '',                         // potongan_admin
      r.subtotal      || '',      // harga_produk
    ])
  ];

  const ws = XLSX.utils.aoa_to_sheet(wsData);
  // Auto column width
  ws['!cols'] = headers.map((_, i) => ({ wch: i < 3 ? 20 : 15 }));

  const wb   = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'TikTok Orders');

  const fname = `tiktok_orders_${new Date().toISOString().slice(0, 10)}.xlsx`;
  XLSX.writeFile(wb, fname);
  toast(`Download ${rows.length} order berhasil`, 'ok');
}

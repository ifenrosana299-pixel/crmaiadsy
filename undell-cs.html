<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Undelivered — CS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#0d1117;color:#e2e8f0;font-size:14px;min-height:100vh}

/* ── Header ── */
.top-bar{background:#161b22;border-bottom:1px solid rgba(255,255,255,.07);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.top-logo{width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.top-title{font-size:15px;font-weight:700;color:#f1f5f9;line-height:1.2}
.top-sub{font-size:11px;color:#64748b;margin-top:1px}
.cs-badge{margin-left:auto;background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}

/* ── Container ── */
.container{max-width:640px;margin:0 auto;padding:16px 12px 32px}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.stat-card{background:#161b22;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 8px;text-align:center}
.stat-num{font-size:22px;font-weight:700;line-height:1}
.stat-label{font-size:10px;color:#64748b;margin-top:3px;line-height:1.3}
.s-yellow .stat-num{color:#fbbf24}
.s-orange .stat-num{color:#fb923c}
.s-red .stat-num{color:#f87171}
.s-blue .stat-num{color:#a5b4fc}
.s-gray .stat-num{color:#94a3b8}
.clickable{cursor:pointer;transition:border-color .15s,transform .1s;active:scale(.97)}
.clickable:active{transform:scale(.96)}
@media(max-width:420px){
  .stats-row{grid-template-columns:repeat(3,1fr)}
  .stats-row .stat-card:nth-child(4),.stats-row .stat-card:nth-child(5){grid-column:span 1}
}

/* ── Search ── */
.search-wrap{margin-bottom:12px}
.search-inp{width:100%;background:#161b22;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px 14px;color:#e2e8f0;font-size:15px;outline:none;-webkit-appearance:none}
.search-inp:focus{border-color:rgba(99,102,241,.5)}
.search-inp::placeholder{color:#475569}

/* ── Cards ── */
.card-list{display:flex;flex-direction:column;gap:10px}
.order-card{background:#161b22;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px;transition:border-color .15s;active:opacity:.9}
.order-card:active{opacity:.88}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.card-nama{font-size:15px;font-weight:700;color:#f1f5f9;line-height:1.3}
.card-resi{font-size:12px;color:#64748b;font-family:monospace;margin-top:2px}
.col-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0}
.col-fu1{background:rgba(245,158,11,.15);color:#fbbf24}
.col-fu2{background:rgba(249,115,22,.15);color:#fb923c}
.col-fu3{background:rgba(239,68,68,.15);color:#f87171}
.col-otw{background:rgba(99,102,241,.15);color:#a5b4fc}

.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tag{font-size:12px;font-weight:500;padding:3px 9px;border-radius:20px}
.tag-eksp{background:rgba(99,102,241,.1);color:#a5b4fc}
.tag-fu{background:rgba(245,158,11,.1);color:#fbbf24}
.tag-hp{background:rgba(255,255,255,.05);color:#94a3b8}

.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-date{font-size:12px;color:#475569}
.btn-handled{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#4ade80;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;min-height:44px}
.btn-handled:active{background:rgba(34,197,94,.25)}
.btn-handled:disabled{opacity:.5;cursor:not-allowed}

/* ── State sections ── */
.state-section{margin-bottom:22px}
.state-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.state-hdr-label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.state-hdr-count{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.sh-fu1 .state-hdr-label{color:#fbbf24} .sh-fu1 .state-hdr-count{background:rgba(245,158,11,.15);color:#fbbf24}
.sh-fu2 .state-hdr-label{color:#fb923c} .sh-fu2 .state-hdr-count{background:rgba(249,115,22,.15);color:#fb923c}
.sh-fu3 .state-hdr-label{color:#f87171} .sh-fu3 .state-hdr-count{background:rgba(239,68,68,.15);color:#f87171}
.sh-otw .state-hdr-label{color:#a5b4fc} .sh-otw .state-hdr-count{background:rgba(99,102,241,.15);color:#a5b4fc}

/* ── Empty / Error / Loading ── */
.center-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:12px;text-align:center;padding:20px}
.state-icon{font-size:52px}
.state-title{font-size:18px;font-weight:700;color:#e2e8f0}
.state-sub{font-size:14px;color:#64748b;max-width:280px;line-height:1.6}
.spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.1);border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Pagination ── */
.pag-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.pag-btn{background:#161b22;border:1px solid rgba(255,255,255,.08);color:#94a3b8;border-radius:8px;padding:8px 20px;font-size:14px;cursor:pointer;font-family:inherit;min-height:44px;min-width:44px}
.pag-btn:active{background:rgba(255,255,255,.06)}
.pag-btn:disabled{opacity:.3;cursor:default}
.pag-info{font-size:13px;color:#64748b}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 20px;font-size:14px;font-weight:500;transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-logo">⚠️</div>
  <div>
    <div class="top-title">Pipeline Undelivered</div>
    <div class="top-sub">Order BERMASALAH yang perlu ditangani</div>
  </div>
  <div class="cs-badge" id="cs-name-badge">Memuat...</div>
</div>

<div class="container">
  <div id="app-body">
    <div class="center-state">
      <div class="spinner"></div>
      <div class="state-sub">Memuat data...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const PAGE_SIZE = 5;
let allOrders  = [];
let csInfo     = {};
let searchVal  = '';
let secPages   = { fu1: 0, fu2: 0, fu3: 0, otw: 0 };

const token = new URLSearchParams(location.search).get('token');

async function init() {
  if (!token) return showError('Token tidak ditemukan', 'Pastikan kamu membuka link yang benar dari admin.');
  try {
    const res = await fetch(`/api/save-settings?action=cs-undell-get&token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok) return showError('Akses Ditolak', data.error || 'Token tidak valid.');
    csInfo    = data.cs;
    allOrders = data.orders || [];
    document.getElementById('cs-name-badge').textContent = '👤 ' + csInfo.nama;
    render();
  } catch(e) {
    showError('Gagal Memuat', e.message);
  }
}

function getCol(o) {
  const fu = o.fu_undell_count || 0;
  const st = o.status_resi;
  if (fu >= 1 && (st === 'OTW' || st === 'KOTA_TUJUAN')) return 'otw';
  if (fu <= 1) return 'fu1';
  if (fu === 2) return 'fu2';
  return 'fu3';
}

function renderSection(key, items, icon, label, cls, secId = '') {
  if (!items.length) return '';
  const pg      = secPages[key] || 0;
  const totalPg = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  const safe    = Math.min(pg, totalPg - 1);
  secPages[key] = safe;
  const sliced  = items.slice(safe * PAGE_SIZE, (safe + 1) * PAGE_SIZE);

  const pagHtml = items.length > PAGE_SIZE ? `
    <div class="pag-row">
      <button class="pag-btn" onclick="secPage('${key}',-1)" ${safe === 0 ? 'disabled' : ''}>‹</button>
      <div class="pag-info">${safe + 1} / ${totalPg}</div>
      <button class="pag-btn" onclick="secPage('${key}',1)" ${safe >= totalPg - 1 ? 'disabled' : ''}>›</button>
    </div>` : '';

  return `
    <div class="state-section sh-${cls}" ${secId ? `id="${secId}"` : ''}>
      <div class="state-hdr">
        <span>${icon}</span>
        <span class="state-hdr-label">${label}</span>
        <span class="state-hdr-count">${items.length}</span>
      </div>
      <div class="card-list">${sliced.map(o => renderCard(o)).join('')}</div>
      ${pagHtml}
    </div>`;
}

function render() {
  const search = searchVal.toLowerCase();

  const byCol = { fu1: [], fu2: [], fu3: [], otw: [] };
  allOrders.forEach(o => {
    const s = `${o.nama_customer} ${o.nomer_resi}`.toLowerCase();
    if (search && !s.includes(search)) return;
    byCol[getCol(o)]?.push(o);
  });

  const total = Object.values(byCol).reduce((s, a) => s + a.length, 0);

  const html = `
    <div class="stats-row">
      <div class="stat-card s-yellow clickable" onclick="scrollToSec('sec-fu1')"><div class="stat-num">${byCol.fu1.length}</div><div class="stat-label">🟡 FU +1</div></div>
      <div class="stat-card s-orange clickable" onclick="scrollToSec('sec-fu2')"><div class="stat-num">${byCol.fu2.length}</div><div class="stat-label">🟠 FU +2</div></div>
      <div class="stat-card s-red clickable" onclick="scrollToSec('sec-fu3')"><div class="stat-num">${byCol.fu3.length}</div><div class="stat-label">🔴 FU +3</div></div>
      <div class="stat-card s-blue clickable" onclick="scrollToSec('sec-otw')"><div class="stat-num">${byCol.otw.length}</div><div class="stat-label">🚚 Dikirim Ulang</div></div>
      <div class="stat-card s-gray"><div class="stat-num">${total}</div><div class="stat-label">Total Order</div></div>
    </div>

    <div class="search-wrap">
      <input class="search-inp" placeholder="🔍 Cari nama customer / nomor resi..." value="${escH(searchVal)}" oninput="onSearch(this.value)">
    </div>

    ${total === 0 ? `
      <div class="center-state" style="min-height:35vh">
        <div class="state-icon">✅</div>
        <div class="state-title">Semua Beres!</div>
        <div class="state-sub">Tidak ada order BERMASALAH${search ? ' yang cocok' : ''} saat ini.</div>
      </div>
    ` : `
      ${renderSection('fu3', byCol.fu3, '🔴', 'FU +3', 'fu3', 'sec-fu3')}
      ${renderSection('fu2', byCol.fu2, '🟠', 'FU +2', 'fu2', 'sec-fu2')}
      ${renderSection('fu1', byCol.fu1, '🟡', 'FU +1', 'fu1', 'sec-fu1')}
      ${renderSection('otw', byCol.otw, '🚚', 'Dikirim Ulang', 'otw', 'sec-otw')}
    `}
  `;

  document.getElementById('app-body').innerHTML = html;
}

function renderCard(o) {
  const fu   = o.fu_undell_count || 0;
  const col  = getCol(o);
  const colLabel = { fu1:'FU +1', fu2:'FU +2', fu3:'FU +3 ⚠️', otw:'🚚 OTW' }[col];
  const colCls   = { fu1:'col-fu1', fu2:'col-fu2', fu3:'col-fu3', otw:'col-otw' }[col];
  const tgl  = fmtDate(o.created_at);

  return `
    <div class="order-card" id="card-${o.id}">
      <div class="card-top">
        <div>
          <div class="card-nama">${escH(o.nama_customer || '-')}</div>
          <div class="card-resi">${escH(o.nomer_resi || '-')}</div>
        </div>
        <span class="col-badge ${colCls}">${colLabel}</span>
      </div>
      <div class="card-tags">
        ${o.ekspedisi ? `<span class="tag tag-eksp">${escH(o.ekspedisi)}</span>` : ''}
        ${fu > 0 ? `<span class="tag tag-fu">FU ${fu}x</span>` : ''}
        ${o.nomer_hp ? `<span class="tag tag-hp">📞 ${escH(o.nomer_hp)}</span>` : ''}
      </div>
      <div class="card-foot">
        <div class="card-date">📅 ${tgl}</div>
        <button class="btn-handled" onclick="tandaiDitangani('${o.id}', this)">✅ Sudah Ditangani</button>
      </div>
    </div>`;
}

async function tandaiDitangani(orderId, btn) {
  btn.disabled = true;
  btn.textContent = '⏳ Menyimpan...';
  try {
    const res = await fetch(`/api/save-settings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'cs-undell-handle', token, order_id: orderId })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal');
    // Hapus dari allOrders local
    allOrders = allOrders.filter(o => o.id !== orderId);
    // Animasi card
    const card = document.getElementById('card-' + orderId);
    if (card) {
      card.style.transition = 'opacity .3s, transform .3s';
      card.style.opacity = '0';
      card.style.transform = 'translateX(20px)';
      setTimeout(() => render(), 300);
    } else {
      render();
    }
    showToast('✅ Order ditandai sudah ditangani');
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '✅ Sudah Ditangani';
    showToast('❌ Gagal: ' + e.message);
  }
}

function scrollToSec(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function secPage(key, dir) {
  secPages[key] = Math.max(0, (secPages[key] || 0) + dir);
  render();
}

function onSearch(val) {
  searchVal = val;
  secPages = { fu1: 0, fu2: 0, fu3: 0, otw: 0 };
  render();
}

function fmtDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function escH(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showError(title, sub) {
  document.getElementById('cs-name-badge').textContent = '—';
  document.getElementById('app-body').innerHTML = `
    <div class="center-state">
      <div class="state-icon">🔒</div>
      <div class="state-title">${escH(title)}</div>
      <div class="state-sub">${escH(sub)}</div>
    </div>`;
}

let _toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

init();
</script>
</body>
</html>
